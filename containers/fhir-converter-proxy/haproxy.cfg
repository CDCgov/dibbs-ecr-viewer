global
    maxconn 200
    log stdout format raw local0

defaults
    mode http
    # Logging
    log global
    option httplog
    
    # 10 seconds for AWS internal networking to connect
    timeout connect 10s
    
    # Increased timeouts are critical for large uploads over the internal network
    timeout client 300s
    timeout server 300s

frontend fhir_converter_proxy
    # In production with an NLB, add 'accept-proxy' here to preserve source IPs
    bind *:${FHIR_CONVERTER_PROXY_PORT}
    
    # 1. Define an ACL that checks the ENVIRONMENT variable
    acl is_local env(ENVIRONMENT) -m str local
    
    # 2. If the variable is 'local', send traffic to the local backend
    use_backend local_converters if is_local
    
    # 3. Otherwise, default to the AWS Service Discovery - ECS backend
    default_backend ecs_converters

backend local_converters
    # Route to the instance with the fewest active connections
    balance leastconn
    
    # Check the converter health API
    option httpchk GET /
    default-server inter 5s fall 5 rise 2

    # maxconn per server forces HAProxy to queue requests rather than crashing the converter
    # Tune this number based on how many large eCRs a single task can handle in RAM at once
    server converter-1 fhir-converter-service:${FHIR_CONVERTER_PORT} check maxconn 3 init-addr last,libc,none

# AWS VPC DNS Resolver (Always at this IP in AWS)
resolvers aws_dns
    nameserver dns1 169.254.169.253:53  # Standard AWS VPC DNS IP
    hold valid 10s                      # Refresh every 10 seconds

backend ecs_converters
    # Route to the instance with the fewest active connections
    balance leastconn
    
    # Check the converter health API
    option httpchk GET /
    default-server inter 5s fall 5 rise 2

    # "server-template" creates 10 "slots". 
    # HAProxy fills them by querying 'fhir-converter-dns.<aws_service_discovery_private_dns_namespace name>'
    server-template converter- 10 fhir-converter-dns.${FHIR_CONVERTER_ECS_NAMESPACE}:${FHIR_CONVERTER_PORT} check resolvers aws_dns init-addr none
