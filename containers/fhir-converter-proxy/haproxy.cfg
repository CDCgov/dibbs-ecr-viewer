global
    maxconn 200
    log stdout format raw local0

defaults
    mode http
    # Logging
    log global
    option httplog
    
    # 10 seconds for AWS internal networking to connect
    timeout connect 10s
    
    # Increased timeouts are critical for large uploads over the internal network
    timeout client 300s
    timeout server 300s

frontend fhir_converter_proxy
    # In production with an NLB, add 'accept-proxy' here to preserve source IPs
    bind *:${FHIR_CONVERTER_PROXY_PORT}
    default_backend fhir_converters

backend fhir_converters
    # Route to the instance with the fewest active connections
    balance leastconn
    
    # Check the converter health API
    option httpchk GET /
    default-server inter 5s fall 5 rise 2

    # maxconn per server forces HAProxy to queue requests rather than crashing the converter
    # Tune this number based on how many large eCRs a single task can handle in RAM at once
    server converter-1 fhir-converter-service:${FHIR_CONVERTER_PORT} check maxconn 3
