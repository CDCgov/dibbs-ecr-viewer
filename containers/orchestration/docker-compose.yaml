  orchestration-service:
    platform: linux/amd64
    build:
      context: .
    depends_on:
      fhir-converter-service:
        condition: service_started
      ingestion-service:
        condition: service_started
      trigger-code-reference-service:
        condition: service_started
      message-parser-service:
        condition: service_started
        required: false
      ecr-viewer:
        condition: service_started
    ports:
      - "${ORCHESTRATION_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"
    env_file:
      - .env
    extra_hosts:
      - host.docker.internal:host-gateway
  fhir-converter-service:
    platform: linux/amd64
    build:
      context: ../fhir-converter
    ports:
      - "${FHIR_CONVERTER_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"
  ingestion-service:
    platform: linux/amd64
    build:
      context: ../ingestion
    ports:
      - "${INGESTION_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"
    environment:
      SMARTY_AUTH_ID: ${SMARTY_AUTH_ID}
      SMARTY_AUTH_TOKEN: ${SMARTY_AUTH_TOKEN}
  message-parser-service:
    platform: linux/amd64
    build:
      context: ../message-parser
    ports:
      - "${MESSAGE_PARSER_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"
  trigger-code-reference-service:
    platform: linux/amd64
    build:
      context: ../trigger-code-reference
    ports:
      - "${TRIGGER_CODE_REFERENCE_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"

volumes:
  db:
  azure-data:
  aws-data:
  gcp-data:
