services:
  postgres:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: postgres
    profiles: ["", "azure", "aws"]
  sqlserver:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: sqlserver
    profiles: ["sqlserver"]
  aws-storage:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: aws-storage
    profiles: ["aws"]
  azure-storage:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: azure-storage
    profiles: ["", "azure"]
  gcp-storage:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: gcp-storage
    profiles: ["gcp"]
  ecr-viewer:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: ecr-viewer
    profiles: ["", "azure", "aws", "sqlserver"]
    depends_on:
      azure-storage:
        condition: service_healthy
    environment:
      - CONFIG_NAME=AZURE_PG_DUAL
      - METADATA_DATABASE_SCHEMA=core
      - METADATA_DATABASE_MIGRATION_SECRET=test
