services:
  postgres:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: postgres
    profiles: ["", "azure", "aws"]
  sqlserver:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: sqlserver
    profiles: ["sqlserver"]
  aws-storage:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: aws-storage
    profiles: ["aws"]
  azure-storage:
    extends:
      file: ../ecr-viewer/docker-compose.yaml
      service: azure-storage
    profiles: ["", "azure"]
  ecr-viewer:
