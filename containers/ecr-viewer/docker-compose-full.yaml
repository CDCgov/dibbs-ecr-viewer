services:
  postgres:
    extends:
      file: ./docker-compose.yaml
      service: postgres
    profiles: ["", "azure", "aws"]
  sqlserver:
    extends:
      file: ./docker-compose.yaml
      service: sqlserver
    profiles: ["sqlserver"]
  aws-storage:
    extends:
      file: ./docker-compose.yaml
      service: aws-storage
    profiles: ["aws"]
  azure-storage:
    extends:
      file: ./docker-compose.yaml
      service: azure-storage
    profiles: ["", "azure"]
  gcp-storage:
    extends:
      file: ./docker-compose.yaml
      service: gcp-storage
    profiles: ["gcp"]
  ecr-viewer:
    extends:
      file: ./docker-compose.yaml
      service: ecr-viewer
    profiles: ["", "azure", "aws", "sqlserver", "gcp"]
    environment:
      - CONFIG_NAME=AZURE_PG_NON_INTEGRATED
      - ORCHESTRATION_URL=http://orchestration-service:8080
  orchestration-service:
    platform: linux/amd64
    build:
      context: ../orchestration
    depends_on:
      [
        fhir-converter-proxy-service,
        ingestion-service,
        trigger-code-reference-service,
        message-parser-service,
        ecr-viewer,
      ]
    ports:
      - "${ORCHESTRATION_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"
    env_file:
      - ../orchestration/.env
  fhir-converter-service:
    platform: linux/amd64
    build:
      context: ../fhir-converter
    ports:
      - "${FHIR_CONVERTER_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://fhir-converter-service:8080/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s # Give it 10s to boot
  fhir-converter-proxy-service:
    platform: linux/amd64
    build:
      context: ../fhir-converter-proxy
    depends_on:
      fhir-converter-service:
        condition: service_healthy
    ports:
      - "${FHIR_CONVERTER_PROXY_PORT_NUMBER}:8080"
    environment:
      FHIR_CONVERTER_PROXY_PORT: ${FHIR_CONVERTER_PROXY_PORT:-8080}
      FHIR_CONVERTER_PORT: ${FHIR_CONVERTER_PORT:-8080}
      ENVIRONMENT: local
  ingestion-service:
    platform: linux/amd64
    build:
      context: ../ingestion
    ports:
      - "${INGESTION_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"
    environment:
      SMARTY_AUTH_ID: ${SMARTY_AUTH_ID}
      SMARTY_AUTH_TOKEN: ${SMARTY_AUTH_TOKEN}
  message-parser-service:
    platform: linux/amd64
    build:
      context: ../message-parser
    ports:
      - "${MESSAGE_PARSER_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"
  trigger-code-reference-service:
    platform: linux/amd64
    build:
      context: ../trigger-code-reference
    ports:
      - "${TRIGGER_CODE_REFERENCE_PORT_NUMBER}:8080"
    logging:
      driver: "json-file"

volumes:
  db:
  azure-data:
  aws-data:
  gcp-data:
