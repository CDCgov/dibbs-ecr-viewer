global
    log stdout format raw local0
    maxconn 4096
    stats socket /var/run/haproxy.sock mode 660 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    retries 3

# Frontend configuration - accepts all HTTP traffic
frontend ecr-viewer-front
    bind *:80

    # ACL for health checks
    acl is_health_check path /ecr-viewer/api/health-check

    # Route to backend
    default_backend ecr-viewer-back

    # HAProxy stats page
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

# Backend with response-time-based load balancing
backend ecr-viewer-back
    # HTTP request headers
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-For %[src]
    http-request set-header Host ecr-viewer

    # Server configuration with weight based on response time
    # server ecr-viewer1 ecr-viewer:3000 check weight 100 maxconn 200 observe layer7 error-count 5
    server ecr-viewer1 ecr-viewer:3000 check weight 100 maxconn 200

    # Health check configuration
    option httpchk GET /ecr-viewer/api/health-check
    http-check expect status 200

    # Response time monitoring (visible in stats page)
    # Server will be marked as down if it doesn't respond within 50s
    timeout server 50s
