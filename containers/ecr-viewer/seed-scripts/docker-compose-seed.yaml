name: ecr-viewer

include:
  - ../docker-compose.yaml
services:
  ecr-viewer:
    environment:
      - ORCHESTRATION_URL=http://localhost:2080

  fhir-converter-service:
    platform: linux/amd64
    build:
      context: ../../fhir-converter/
    ports:
      - "2082:8080"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}

  ingestion-service:
    platform: linux/amd64
    build:
      context: ../../ingestion
    ports:
      - "2083:8080"
    logging:
      driver: "json-file"
    environment:
      SMARTY_AUTH_ID: ${SMARTY_AUTH_ID}
      SMARTY_AUTH_TOKEN: ${SMARTY_AUTH_TOKEN}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}

  message-parser-service:
    platform: linux/amd64
    build:
      context: ../../message-parser
    ports:
      - "2085:8080"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
    logging:
      driver: "json-file"

  trigger-code-reference-service:
    platform: linux/amd64
    build:
      context: ../../trigger-code-reference
    ports:
      - "2086:8080"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
    logging:
      driver: "json-file"

  orchestration-service:
    platform: linux/amd64
    build:
      context: ../../orchestration/
    depends_on:
      - fhir-converter-service
      - ingestion-service
      - message-parser-service
      - ecr-viewer
    ports:
      - "2080:8080"
    logging:
      driver: "json-file"
    env_file:
      - ../../orchestration/.env
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - ECR_VIEWER_URL=http://host.docker.internal:3000/ecr-viewer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://orchestration-service:8080/"]
      interval: 10s
      timeout: 20s
      retries: 5

  convert-data:
    build: .
    depends_on:
      orchestration-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "2081:8081"
    volumes:
      - ./baseECR:/code/baseECR
    environment:
      - CONFIG_NAME
      - SEED_DATA_DIRECTORIES=${SEED_DATA_DIRECTORIES:-star-wars}
      - UPLOAD_URL=${UPLOAD_URL:-http://host.docker.internal:3000/ecr-viewer/api/process-ecr}
      - AUTH_PROVIDER
      - AUTH_CLIENT_ID
      - AUTH_CLIENT_SECRET
      - AUTH_ISSUER
      - AUTH_ADMIN_USER
      - AUTH_ADMIN_PASSWORD
      - DUMMY_NBS_JWT
    extra_hosts:
      - host.docker.internal:host-gateway
