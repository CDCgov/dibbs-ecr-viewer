name: ecr-viewer

include:
  - ../docker-compose.yaml
services:
  fhir-converter-service:
    platform: linux/amd64
    build:
      context: ../../fhir-converter/
    ports:
      - "8082:8080"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://fhir-converter-service:8080/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s # Give it 10s to boot

  fhir-converter-proxy-service:
    platform: linux/amd64
    build:
      context: ../../fhir-converter-proxy/
    depends_on:
      fhir-converter-service:
        condition: service_healthy
    ports:
      - "8087:8080"
    environment:
      FHIR_CONVERTER_PROXY_PORT: ${FHIR_CONVERTER_PROXY_PORT:-8080}
      FHIR_CONVERTER_PORT: ${FHIR_CONVERTER_PORT:-8080}
      ENVIRONMENT: local

  ingestion-service:
    platform: linux/amd64
    build:
      context: ../../ingestion
    ports:
      - "8083:8080"
    logging:
      driver: "json-file"
    environment:
      SMARTY_AUTH_ID: ${SMARTY_AUTH_ID}
      SMARTY_AUTH_TOKEN: ${SMARTY_AUTH_TOKEN}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}

  message-parser-service:
    platform: linux/amd64
    build:
      context: ../../message-parser
    ports:
      - "8085:8080"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
    logging:
      driver: "json-file"

  trigger-code-reference-service:
    platform: linux/amd64
    build:
      context: ../../trigger-code-reference
    ports:
      - "8086:8080"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
    logging:
      driver: "json-file"

  orchestration-service:
    platform: linux/amd64
    build:
      context: ../../orchestration/
    depends_on:
      - fhir-converter-proxy-service
      - ingestion-service
      - message-parser-service
      - ecr-viewer
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
    env_file:
      - ../../orchestration/.env
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - ECR_VIEWER_URL=http://host.docker.internal:3000/ecr-viewer
      - FHIR_CONVERTER_URL=http://fhir-converter-proxy-service:8080 # Remove this to point to the FHIR Converter directly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://orchestration-service:8080/"]
      interval: 10s
      timeout: 20s
      retries: 5

  convert-data:
    build: .
    depends_on:
      orchestration-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - ./baseECR:/code/baseECR
    environment:
      - CONFIG_NAME
      - SEED_DATA_DIRECTORIES=${SEED_DATA_DIRECTORIES:-star-wars}
      - UPLOAD_URL=${UPLOAD_URL:-http://host.docker.internal:3000/ecr-viewer/api/process-ecr}
      - AUTH_PROVIDER
      - AUTH_CLIENT_ID
      - AUTH_CLIENT_SECRET
      - AUTH_ISSUER
      - AUTH_ADMIN_USER
      - AUTH_ADMIN_PASSWORD
      - DUMMY_NBS_JWT
    extra_hosts:
      - host.docker.internal:host-gateway
