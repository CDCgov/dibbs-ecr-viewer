include:
  - ../docker-compose.yaml

services:
  fhir-converter-service:
    platform: linux/amd64
    build:
      context: ../../fhir-converter/
    ports:
      - "8082:8080"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://fhir-converter-service:8080/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s # Give it 10s to boot

  fhir-converter-proxy-service:
    platform: linux/amd64
    build:
      context: ../../fhir-converter-proxy/
    depends_on:
      fhir-converter-service:
        condition: service_healthy
    ports:
      - "8087:8080"
    environment:
      FHIR_CONVERTER_PROXY_PORT: ${FHIR_CONVERTER_PROXY_PORT:-8080}
      FHIR_CONVERTER_PORT: ${FHIR_CONVERTER_PORT:-8080}
      ENVIRONMENT: local

  ingestion-service:
    platform: linux/amd64
    build:
      context: ../../ingestion
    ports:
      - "8083:8080"
    logging:
      driver: "json-file"
    environment:
      SMARTY_AUTH_ID: ${SMARTY_AUTH_ID}
      SMARTY_AUTH_TOKEN: ${SMARTY_AUTH_TOKEN}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}

  message-parser-service:
    platform: linux/amd64
    build:
      context: ../../message-parser
    ports:
      - "8085:8080"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
    logging:
      driver: "json-file"

  trigger-code-reference-service:
    platform: linux/amd64
    build:
      context: ../../trigger-code-reference
    ports:
      - "8086:8080"
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
    logging:
      driver: "json-file"

  orchestration-service:
    platform: linux/amd64
    build:
      context: ../../orchestration/
    depends_on:
      - fhir-converter-proxy-service
      - ingestion-service
      - message-parser-service
      - ecr-viewer
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
    env_file:
      - ../../orchestration/.env
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - ECR_VIEWER_URL=http://host.docker.internal:3000/ecr-viewer
      - FHIR_CONVERTER_URL=http://fhir-converter-proxy-service:8080 # Remove this to point to the FHIR Converter directly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://orchestration-service:8080/"]
      interval: 10s
      timeout: 20s
      retries: 5

  migrator:
    image: curlimages/curl
    environment:
      - DUMMY_NBS_JWT=${DUMMY_NBS_JWT}
    command: >
      sh -c "echo 'Running migrations' && curl -v -X POST http://host.docker.internal:3000/ecr-viewer/api/migrate-db -H 'Authorization: Bearer '"$DUMMY_NBS_JWT" -F 'migration_secret=test' -F 'init_admin_email=ecr-viewer@admin.com' && echo 'Migrations complete' exit 0"
    depends_on:
      ecr-viewer:
        condition: service_healthy

  locust:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/home/locust/locustfile.py
      - ./requirements.txt:/home/locust/requirements.txt
      - ./baseECR/star-wars:/home/locust/baseECR/star-wars
    command: >
      -f /home/locust/locustfile.py
      --web-host 0.0.0.0
      --host http://host.docker.internal:3000/ecr-viewer
    environment:
      - DUMMY_NBS_JWT=${DUMMY_NBS_JWT}
    depends_on:
      migrator:
        condition: service_completed_successfully
