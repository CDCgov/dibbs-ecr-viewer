name: Deploy to AWS
run-name: "Deploy ${{ inputs.release_tag }} to AWS with config:${{ inputs.config_name }} identifier:${{ inputs.id }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        description: "The release tag for the image you want to deploy. Example: v2.6.0"
        required: true
      config_name:
        type: choice
        description: "The value for the CONFIG_NAME environment variable"
        required: true
        options:
          - AWS_INTEGRATED
          - AWS_PG_NON_INTEGRATED
          - AWS_SQLSERVER_NON_INTEGRATED
          - AWS_PG_DUAL
          - AWS_SQLSERVER_DUAL
      id:
        type: string
        description: "Unique identifier for the environment (will be part of the url). Example: integrated-testing"
        required: true
      auth_provider:
        type: choice
        description: "What auth provider to use. 'ad' for dual/non-integrated else 'none'"
        required: true
        options:
          - ad
          - none

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS
        run: |
          repo_owner="CDCgov" 
          repo_name="dibbs-aws"  
          event_type="trigger-workflow" 
          release_tag="${{ github.event.inputs.release_tag }}"
          config_name="${{ github.event.inputs.config_name }}"
          id="${{ github.event.inputs.id}}"
          auth_provider="${{ github.event.inputs.auth_provider }}"
          version="${{ github.event.inputs.release_tag }}"
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DIBBS_VM_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"dibbs-ecr-viewer-version\": \"$release_tag\", \"dibbs-ecr-viewer-config-name\": \"$config_name\", \"dibbs-ecr-viewer-auth-provider\": \"$auth_provider\"}}"