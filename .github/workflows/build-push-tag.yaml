name: Build & Push Tag
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: Already created git tag to build and push to ghcr
        type: string

# Does not run tests before building/pushing
jobs:
  list-containers:
    uses: ./.github/workflows/list-containers.yaml

  # Rebuild all containers for the new release
  build-containers-for-release:
    name: Build containers
    needs:
      - list-containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container-to-build: ${{fromJson(needs.list-containers.outputs.all-containers)}}
    steps:
      - name: Check Out Changes
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{matrix.container-to-build}}
          context: git
          tags: |
            type=ref,event=tag
          flavor: |
            latest=false
            prefix=
            suffix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./containers/${{matrix.container-to-build}}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ inputs.tag }}
