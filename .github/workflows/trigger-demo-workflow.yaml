name: Trigger Demo Deployment Workflow
run-name: "Trigger ${{ inputs.event_type }} - Container Tag: ${{ inputs.container_tag }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      container_tag:
        type: string
        description: "The version to deploy. Example: v2.6.0 or main"
        required: true
        default: main
      event_type:
        type: choice
        options:
          - plan
          - deploy
        description: "The event type to trigger the workflow."
        required: true

jobs:
  trigger_demo_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Demo
        env:
          CONTAINER_TAG: ${{ inputs.container_tag }}
          EVENT_TYPE: ${{ inputs.event_type }}
        run: |
          service="dibbs-ecr-viewer"
          repo_owner="skylight-hq"
          repo_name="dibbs-tf-envs"
          event_type="trigger-demo-$EVENT_TYPE"
          container_tag="$CONTAINER_TAG"
          response="$(curl -L -w '%{http_code}\n' -o /dev/null \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DIBBS_SKYLIGHT_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"version\": \"$container_tag\", \"service\": \"$service\"}}")"
          if [ $response -ne 204 ]; then
            echo "Failed to trigger the workflow."
            exit 1
          fi
          echo "View your workflow run at: https://github.com/skylight-hq/dibbs-tf-envs/actions"
          echo "Successfully triggered the workflow."
          echo "Service: $service"
          echo "Repository: $repo_owner/$repo_name"
          echo "Event Type: $event_type"
          echo "Container Tag: $container_tag"
