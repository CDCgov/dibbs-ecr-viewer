name: Create New Pre-Release
on:
  release:
    types: [prereleased]

# Run all tests before making a release
jobs:
  list-containers:
    uses: ./.github/workflows/listContainers.yaml

  test-for-release:
    # just for testing
    if: false
    needs:
      - list-containers
    strategy:
      matrix:
        container: ${{fromJson(needs.list-containers.outputs.all-containers)}}
    uses: ./.github/workflows/run-container-workflow.yaml
    with:
      container: ${{ matrix.container }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit

  # Rebuild all containers for the new release
  build-containers-for-release:
    name: Build containers
    needs:
      - list-containers
      # - test-for-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container-to-build: ${{fromJson(needs.list-containers.outputs.all-containers)}}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check Out Changes
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{matrix.container-to-build}}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./containers/${{matrix.container-to-build}}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION: ${{ steps.meta.outputs.version }}

  deploy-container-to-aws-test-env:
    needs:
      - build-containers-for-release
    uses: ./.github/workflows/trigger-dev-workflow.yaml
    with:
      container_tag: ${{ needs.build-containers-for-release.outputs.version }}
