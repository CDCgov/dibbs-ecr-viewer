name: Trigger Deploy to AWS Dev
run-name: "Trigger Deploy - Service: ${{ inputs.service }}, Version: ${{ inputs.version }}, Dev ID: dev${{ inputs.dev_id }}, Config Name: ${{ inputs.config_name }}, Terraform Branch: ${{ inputs.tf_branch }}, Event Type: ${{ inputs.event_type }} to AWS Dev by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      service:
        type: string
        description: "The service you want to deploy. dibbs-ecr-viewer"
        required: true
        default: dibbs-ecr-viewer
      version:
        type: string
        description: "The version to deploy. Example: v2.6.0 or main"
        required: true
        default: main
      dev_id:
        type: choice
        description: "The unique ID for the dev environment. Must be between 0 and 255."
        options:
          - "7"
          - "42"
      config_name:
        type: choice
        description: "Sets CONFIG_NAME on dibbs-ecr-viewer"
        required: true
        options: # not supported yet: AWS_SQLSERVER_NON_INTEGRATED, AWS_SQLSERVER_DUAL
          - AWS_PG_NON_INTEGRATED
          - AWS_PG_DUAL
          - AWS_INTEGRATED
      tf_branch:
        type: string
        description: "The branch to use for the Terraform code. Default is main."
        required: false
        default: main
      event_type:
        type: choice
        options:
          - trigger-dev-plan
          - trigger-dev-deploy
        description: "The event type to trigger the workflow."
        required: true

jobs:
  trigger_dev_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS Dev
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          DEV_ID: ${{ inputs.dev_id }}
          CONFIG_NAME: ${{ inputs.config_name }}
          TF_BRANCH: ${{ inputs.tf_branch }}
          EVENT_TYPE: ${{ inputs.event_type }}
        run: |
          repo_owner="CDCgov"
          repo_name="dibbs-aws"
          service="$SERVICE"
          version="$VERSION"
          dev_id="$DEV_ID"
          config_name="$CONFIG_NAME"
          tf_branch="$TF_BRANCH"
          event_type="$EVENT_TYPE"
          response="$(curl -L -w '%{http_code}\n' -o /dev/null \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"version\": \"$version\", \"service\": \"$service\", \"dev_id\": \"$dev_id\", \"config_name\": \"$config_name\", \"tf_branch\": \"$tf_branch\"}}")"
          if [ $response -ne 204 ]; then
            echo "Failed to trigger the workflow."
            exit 1
          fi
          echo "View your workflow run at: https://github.com/$repo_owner/$repo_name/actions"
          echo "Successfully triggered the workflow."
          echo "Service: $service"
          echo "Version: $version"
          echo "Dev ID: $dev_id"
          echo "Config Name: $config_name"
          echo "Terraform Branch: $tf_branch"
          echo "Event Type: $event_type"
