# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

multi-ecosystem-groups:
  all-updates:
    schedule:
      interval: "weekly"
      day: "sunday"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "npm"
    directory: "/containers/ecr-viewer"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "docker"
    directory: "/containers/ecr-viewer"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "pip"
    directory: "/containers/orchestration"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "docker"
    directory: "/containers/orchestration"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "pip"
    directory: "/containers/fhir-converter"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "docker"
    directory: "/containers/fhir-converter"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "pip"
    directory: "/containers/ingestion"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "docker"
    directory: "/containers/ingestion"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "pip"
    directory: "/containers/message-parser"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "docker"
    directory: "/containers/message-parser"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "pip"
    directory: "/containers/trigger-code-reference"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "docker"
    directory: "/containers/trigger-code-reference"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
  - package-ecosystem: "docker"
    directory: "/containers/fhir-converter-proxy"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: "all-updates"
